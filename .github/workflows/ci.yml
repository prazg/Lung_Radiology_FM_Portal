name: CI — Schema, Runners & FastAPI Mock Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight server & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-server.txt

      - name: Run pytest suite across all 33 models x tasks
        env:
          PORTAL_MOCK: "1"
        run: pytest -v backend/tests/test_api_mock.py
